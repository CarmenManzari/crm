function log(msg, type='info') {
  const div = document.getElementById('log');
  div.innerHTML += `<div class="log-${type}">${msg}</div>`;
  div.scrollTop = div.scrollHeight;
}

async function saveClient(client) {
  const resp = await fetch(SB_URL + '/clienti', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify({ id: client.id, data: client, updated_at: new Date().toISOString() })
  });
  if (!resp.ok) {
    const txt = await resp.text();
    throw new Error(txt);
  }
}

async function startImport() {
  document.getElementById('start-btn').disabled = true;
  const total = clients.length;
  let ok = 0, err = 0;
  log(`Inizio importazione di ${total} clienti con tutti i dati...`, 'info');
  
  for (let i = 0; i < total; i += 10) {
    const batch = clients.slice(i, i + 10);
    await Promise.all(batch.map(async c => {
      try {
        await saveClient(c);
        ok++;
      } catch(e) {
        err++;
        if (err <= 3) log(`❌ Errore ${c.nome} ${c.cognome}: ${e.message.substring(0,100)}`, 'err');
      }
    }));
    
    const pct = Math.round((i + batch.length) / total * 100);
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('status').textContent = `Importati ${ok} di ${total}...`;
    if (i % 100 === 0 && i > 0) log(`✓ ${ok} clienti importati...`, 'ok');
    await new Promise(r => setTimeout(r, 150));
  }
  
  log(`✅ Completato! ${ok} clienti importati, ${err} errori.`, 'ok');
  document.getElementById('status').textContent = `✅ Completato! ${ok} clienti importati.`;
  document.getElementById('done-btn').style.display = 'block';
}
